# =============================================================================
# Quality Triage — Central Configuration
# Edit this file to customise every aspect of the code review agent.
# =============================================================================

# ---------------------------------------------------------------------------
# Provider: "ollama" (default, local, no API key) | "openai" | "anthropic"
# ---------------------------------------------------------------------------
provider: ollama

# --- Local Ollama (OpenAI-compatible REST API) ------------------------------
ollama:
  model: qwen3.5:4b              # supports function calling; try llama3.1 or mistral-nemo
  base_url: http://localhost:11434/v1
  api_key: ollama
  max_tokens: 8192
  max_iterations: 25
  timeout: 120                   # per-request timeout in seconds

# --- Generic OpenAI-compatible backend --------------------------------------
# Works with the official OpenAI API and ANY service exposing an
# OpenAI-compatible /chat/completions endpoint. Just change base_url + key.
#
#   OpenAI      base_url: https://api.openai.com/v1            key env: OPENAI_API_KEY
#   Groq        base_url: https://api.groq.com/openai/v1       key env: GROQ_API_KEY
#   OpenRouter  base_url: https://openrouter.ai/api/v1         key env: OPENROUTER_API_KEY
#               (also set extra_headers HTTP-Referer / X-Title)
#   Together    base_url: https://api.together.xyz/v1          key env: TOGETHER_API_KEY
#   Fireworks   base_url: https://api.fireworks.ai/inference/v1 key env: FIREWORKS_API_KEY
#   Mistral     base_url: https://api.mistral.ai/v1            key env: MISTRAL_API_KEY
#   llama.cpp   base_url: http://localhost:8080/v1             key: any (server)
#   vLLM        base_url: http://localhost:8000/v1             key: any
#   LM Studio   base_url: http://localhost:1234/v1            key: any
openai:
  model: gpt-4o-mini
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY    # name of the env var holding the key
  # api_key:                     # (discouraged) put the key inline instead of env
  max_tokens: 8192
  max_iterations: 25
  timeout: 180
  extra_headers: {}              # e.g. {"HTTP-Referer": "...", "X-Title": "..."}

# --- Anthropic Claude -------------------------------------------------------
anthropic:
  model: claude-opus-4-6
  api_key_env: ANTHROPIC_API_KEY
  max_tokens: 8192
  max_iterations: 20
  # api_key: set via ANTHROPIC_API_KEY environment variable

# ---------------------------------------------------------------------------
# GitHub integration
# ---------------------------------------------------------------------------
github:
  clone_dir: /tmp/code_review_repos
  depth: 1                       # shallow clone (faster)
  timeout: 120                   # clone timeout in seconds
  # token: set via GITHUB_TOKEN env var for private repos

# ---------------------------------------------------------------------------
# Tool execution defaults
# ---------------------------------------------------------------------------
tools:
  ignore_dirs:
    - .git
    - __pycache__
    - venv
    - .venv
    - node_modules
    - dist
    - build
    - .tox
    - .eggs
    - htmlcov
    - .mypy_cache
    - .ruff_cache
  read_file_max_lines: 500
  td_classifier:
    # Binary, per-category technical-debt model on the HuggingFace Hub.
    # General TD detector by default; pass --category on the CLI to pick another.
    # Categories: general, code, design, documentation, test, defect, requirement,
    # build, automation, people, process, infrastructure, architecture, service,
    # security, performance, usability, maintainability, reliability, portability,
    # compatibility. List them with: code-review run-tool td-categories
    # Multi-label sweep:  run-tool classify-td-all
    # Weighted ensemble:  run-tool classify-td-ensemble
    # GitHub issues pipeline: run-tool td-issues owner/repo  (set GITHUB_TOKEN)
    model_path: karths/binary_classification_train_TD
    backend: auto                # auto | onnx | torch
    device: cpu                  # cpu | cuda | mps
    # onnx_path:                 # optional local .onnx model to use directly
    batch_size: 32

# ---------------------------------------------------------------------------
# Review selection + fixes (what runs, and whether fixes may be applied)
# CLI flags override these:  --check, --td-category, --min-severity,
# --format, --suggest-fixes / --fix-dry-run / --apply-fixes
# ---------------------------------------------------------------------------
review:
  # Detector families to run by default. Any subset of:
  #   ml | code | architectural | structural | td | code-intel
  checks:
    - ml
    - code
    - architectural
    - structural
    - td
    - code-intel
  # TD categories used when the 'td' family runs (see: run-tool td-categories).
  td_categories:
    - general
  min_severity: low              # critical | high | medium | low | info
  output_format: markdown        # markdown | json
  suggest_fixes: false           # ask the agent for machine-applicable fixes
  apply_fixes: false             # NEVER writes without explicit --apply-fixes + confirm

# ---------------------------------------------------------------------------
# Code intelligence (pure-Python AST analysis)
# ---------------------------------------------------------------------------
code_intel:
  max_file_size_kb: 500
  include_private_symbols: false  # include _underscore symbols
  metrics_enabled: true
  top_complexity_n: 15            # report the N most complex functions

# ---------------------------------------------------------------------------
# Report settings
# ---------------------------------------------------------------------------
report:
  output_dir: ./reports
  default_format: markdown        # markdown | json | both
  include_code_snippets: true
  max_snippet_lines: 10
  min_severity: low               # critical | high | medium | low | info
  open_after_write: false

# ---------------------------------------------------------------------------
# Thresholds passed to code_quality_analyzer detectors
# ---------------------------------------------------------------------------
code_smells:
  LONG_METHOD_LINES:
    value: 45
    explanation: "Methods longer than this many lines may be too complex."
  LARGE_CLASS_METHODS:
    value: 15
    explanation: "Classes with more than this many methods have too many responsibilities."
  PRIMITIVE_OBSESSION_COUNT:
    value: 4
    explanation: "Functions with more than this many primitive parameters."
  LONG_PARAMETER_LIST:
    value: 5
    explanation: "Functions with more than this many parameters."
  COMPLEX_CONDITIONAL:
    value: 3
    explanation: "If-else chains longer than this indicate a switch smell."
  DIVERGENT_CHANGE_PREFIXES:
    value: 4
    explanation: "Distinct method name prefix count threshold."
  SHOTGUN_SURGERY_CALLS:
    value: 5
    explanation: "Methods called in more than this many places."
  EXCESSIVE_COMMENTS_RATIO:
    value: 0.3
    explanation: "Ratio of comment lines to total lines."
  LAZY_CLASS_METHODS:
    value: 4
    explanation: "Classes with this few methods or fewer are lazy."
  LAZY_CLASS_LINES:
    value: 15
    explanation: "Lazy-class detector: max total non-trivial method lines (key omitted by the upstream package config; added so the detector can run)."
  DATA_CLASS_METHODS:
    value: 5
    explanation: "Data-class detector: min getter/setter count with no other methods (key omitted by the upstream package config; added so the detector can run)."
  FEATURE_ENVY_CALLS:
    value: 3
    explanation: "Calls to another object's methods threshold."
  INAPPROPRIATE_INTIMACY_SHARED:
    value: 3
    explanation: "Shared fields/methods between classes threshold."
  MESSAGE_CHAIN_LENGTH:
    value: 3
    explanation: "Method call chain length threshold."
  DATA_CLUMPS_THRESHOLD:
    value: 6
    explanation: "Parameter groups appearing together threshold."
  TEMPORARY_FIELD_THRESHOLD:
    value: 3
    explanation: "Unused-in-most-methods fields threshold."
  ALTERNATIVE_CLASSES_THRESHOLD:
    value: 3
    explanation: "Classes with identical method sets threshold."
  DUPLICATE_CODE_THRESHOLD:
    value: 15
    explanation: "Identical code blocks threshold."
  DEAD_CODE_THRESHOLD:
    value: 3
    explanation: "Defined-but-never-called functions threshold."
  SPECULATIVE_GENERALITY_THRESHOLD:
    value: 4
    explanation: "Abstract classes with no concrete impls threshold."
  UNUSED_PARAMETERS_THRESHOLD:
    value: 6
    explanation: "Unused method parameters threshold."
  MIDDLE_MAN_RATIO:
    value: 0.5
    explanation: "Ratio of delegating methods threshold."
  DUPLICATE_CODE_MIN_LINES:
    value: 5
    explanation: "Minimum lines for duplicate code detection."

architectural_smells:
  GOD_OBJECT_FUNCTIONS:
    value: 20
    explanation: "Module function count for god-object detection."
  UNSTABLE_DEPENDENCY_THRESHOLD:
    value: 0.8
    explanation: "Instability ratio threshold."
  HUB_LIKE_DEPENDENCY_RATIO:
    value: 0.3
    explanation: "Hub-like module connection ratio."
  REDUNDANT_ABSTRACTION_SIMILARITY:
    value: 0.7
    explanation: "Function similarity threshold for redundant abstractions."
  IMPROPER_API_USAGE_RATIO:
    value: 0.7
    explanation: "Repeated API calls ratio threshold."
  CYCLIC_DEPENDENCY_MAX_LENGTH:
    value: 3
    explanation: "Max cycle length before flagging."

structural_smells:
  NOM_THRESHOLD:
    value: 10
    explanation: "Number of Methods per class."
  WMPC1_THRESHOLD:
    value: 20
    explanation: "Weighted Methods per Class (complexity)."
  WMPC2_THRESHOLD:
    value: 20
    explanation: "Weighted Methods per Class (params)."
  SIZE2_THRESHOLD:
    value: 15
    explanation: "Class member count."
  WAC_THRESHOLD:
    value: 10
    explanation: "Fields per class."
  LCOM_THRESHOLD:
    value: 10
    explanation: "Lack of Cohesion in Methods."
  RFC_THRESHOLD:
    value: 20
    explanation: "Response for Class."
  NOCC_THRESHOLD:
    value: 10
    explanation: "Classes per module."
  DIT_THRESHOLD:
    value: 3
    explanation: "Depth of Inheritance Tree."
  LOC_THRESHOLD:
    value: 150
    explanation: "Lines of code per module."
  MPC_THRESHOLD:
    value: 25
    explanation: "Message Passing Coupling."
  CBO_THRESHOLD:
    value: 5
    explanation: "Coupling Between Objects."
  NOC_THRESHOLD:
    value: 7
    explanation: "Number of classes in project."
  CYCLOMATIC_COMPLEXITY_THRESHOLD:
    value: 10
    explanation: "Cyclomatic complexity per method."
  MAX_FANOUT:
    value: 15
    explanation: "Outgoing dependencies per module."
  MAX_FANIN:
    value: 15
    explanation: "Incoming dependencies per module."
  MAX_FILE_LENGTH:
    value: 250
    explanation: "File line count."
  MAX_BRANCHES:
    value: 10
    explanation: "Branch count per method."
  MAX_NESTING_DEPTH:
    value: 4
    explanation: "Code nesting depth."
